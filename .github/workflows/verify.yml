name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - run: composer validate --no-check-publish
      - run: composer install --no-interaction --prefer-dist
      - run: php -r "require 'vendor/autoload.php'; exit(class_exists('Ruba\\Ruba') ? 0 : 1);"
      - run: composer stan
      - name: Verify public source
        run: |
          forbidden_reference="$(printf '%s%s' 'po' 'lar')"
          if git grep -in "$forbidden_reference"; then
            exit 1
          fi
